services:
  postgres:
    image: postgres:16-alpine
    container_name: bottagon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bottagon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bottagon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxyd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bottagon-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bottagon}?sslmode=disable
      LOG_LEVEL: info
      ENV: production
    ports:
      - "8080:8080"

volumes:
  pgdata:
